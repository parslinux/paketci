[project]
name = "paketci"
version = "0.1.0"
description = "Modern, hızlı ve güvenilir Python paket yöneticisi"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "packaging>=24",
    "resolvelib>=1.0",
    "installer>=0.7",
    "build>=1.0",
    "tomlkit>=0.12",
    "platformdirs>=4",
    "filelock>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
paketci = "paketci.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

